<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login / Register - Fariha Jannat</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Background Glow & Waves -->
  <div class="glow-effect"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>

  <div class="bg-container">
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#B87DFF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
    </svg>

    <svg class="svg-element right-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,50 Q130,40 90,100 Q140,90 180,50 Z" fill="#B87DFF"/>
    </svg>

    <svg class="svg-element bottom-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,180 Q140,100 160,40 Q190,120 180,180 Z" fill="#B87DFF"/>
    </svg>
    <svg class="svg-element top-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,20 Q120,40 80,100 Q130,80 180,20 Z" fill="#B87DFF"/>
    </svg>
  </div>

  <div class="app-viewport">
    
    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Admin Profile & Dynamic Welcome Banner -->
      <div class="auth-top-profile">
        <div class="auth-avatar-ring">
          <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=female_avatar_1" alt="Fariha Jannat">
        </div>
        <div class="auth-welcome-banner">
          <span class="auth-welcome-text" data-i18n="welcomeBanner">ফারিহা জান্নাতের পক্ষ থেকে আপনাকে স্বাগতম</span>
        </div>
      </div>

      <!-- Auth Glass Card -->
      <div class="glass-card auth-card">
        <h3 class="auth-main-title" id="auth-title" data-i18n="welcomeTitle">Welcome Back</h3>
        
        <!-- Auth Tabs (Login / Register) -->
        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')" data-i18n="loginTab">Login</button>
          <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')" data-i18n="registerTab">Register</button>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
          <div class="input-group" id="name-group" style="display: none;">
            <label data-i18n="fullNameLabel">Full Name</label>
            <input type="text" id="auth-name" placeholder="Fariha Jannat">
          </div>

          <div class="input-group">
            <label data-i18n="emailLabel">Email</label>
            <input type="email" id="auth-email" required placeholder="example@mail.com">
          </div>

          <div class="input-group">
            <label data-i18n="passwordLabel">Password</label>
            <div class="password-container">
              <input type="password" id="auth-password" required placeholder="••••••••">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>
          </div>

          <button type="submit" id="auth-submit-btn" class="btn-gradient" data-i18n="loginBtn">Login</button>
        </form>
      </div>
    </main>

  </div>

  <!-- Supabase & App Logic Script -->
  <script>
    const SUPABASE_URL = "https://bagscbfokioflnuyxcuz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZ3NjYmZva2lvZmxudXl4Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjAxOTEsImV4cCI6MjEwODk5NjE5MX0.9iU1vhruNSO54Van2GIBM1OrofuUfplWtPC7O7cV60s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const i18n = {
      en: {
        welcomeBanner: "Welcome from Fariha Jannat",
        welcomeTitle: "Welcome Back",
        createAccountTitle: "Create Account",
        loginTab: "Login",
        registerTab: "Register",
        fullNameLabel: "Full Name",
        emailLabel: "Email",
        passwordLabel: "Password",
        loginBtn: "Login",
        registerBtn: "Register"
      },
      bn: {
        welcomeBanner: "ফারিহা জান্নাতের পক্ষ থেকে আপনাকে স্বাগতম",
        welcomeTitle: "স্বাগতম",
        createAccountTitle: "একাউন্ট তৈরি করুন",
        loginTab: "লগইন",
        registerTab: "রেজিস্ট্রেশন",
        fullNameLabel: "পূর্ণ নাম",
        emailLabel: "ইমেইল",
        passwordLabel: "পাসওয়ার্ড",
        loginBtn: "লগইন করুন",
        registerBtn: "রেজিস্ট্রেশন করুন"
      }
    };

    let currentLang = localStorage.getItem('app_lang') || 'bn';
    let isLoginMode = true;

    function applyTranslations() {
      const texts = i18n[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (texts[key]) el.innerText = texts[key];
      });
    }

    function switchAuthTab(type) {
      isLoginMode = (type === 'login');
      const texts = i18n[currentLang];
      document.getElementById('name-group').style.display = isLoginMode ? 'none' : 'block';
      document.getElementById('auth-title').innerText = isLoginMode ? texts.welcomeTitle : texts.createAccountTitle;
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? texts.loginBtn : texts.registerBtn;
      document.getElementById('tab-login').classList.toggle('active', isLoginMode);
      document.getElementById('tab-signup').classList.toggle('active', !isLoginMode);
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('auth-password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (!isLoginMode) {
        const fullName = document.getElementById('auth-name').value || "User";
        const { error } = await db.auth.signUp({ 
          email, 
          password, 
          options: { data: { full_name: fullName, avatar_url: "https://api.dicebear.com/7.x/bottts-neutral/svg?seed=user_" + Date.now() } } 
        });
        if (error) return alert(error.message);
        alert("Registration successful! Please login.");
        switchAuthTab('login');
      } else {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) return alert(error.message);
        
        const { data: profile } = await db.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
        if (profile && profile.is_admin) {
          window.location.href = 'admin-home.html';
        } else {
          window.location.href = 'user-home.html';
        }
      }
    }

    window.onload = () => {
      applyTranslations();
    };
  </script>
</body>
</html>
