<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Home - Fariha Jannat</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Background Glow & Waves -->
  <div class="glow-effect"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>

  <div class="bg-container">
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#B87DFF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
    </svg>

    <svg class="svg-element right-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,50 Q130,40 90,100 Q140,90 180,50 Z" fill="#B87DFF"/>
    </svg>

    <svg class="svg-element bottom-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,180 Q140,100 160,40 Q190,120 180,180 Z" fill="#B87DFF"/>
    </svg>
    <svg class="svg-element top-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,20 Q120,40 80,100 Q130,80 180,20 Z" fill="#B87DFF"/>
    </svg>
  </div>

  <div class="app-viewport">
    
    <!-- Main Content Area -->
    <main class="main-content">
      <section class="screen">
        
        <!-- Admin Profile Top Section -->
        <div class="admin-top-profile">
          <div class="admin-avatar-ring">
            <img id="admin-avatar" src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=female_avatar_1" alt="Fariha Jannat">
            <span class="verified-tick">✓</span>
          </div>
          <div class="admin-title-area">
            <h2 id="admin-name">Fariha Jannat</h2>
            <div class="admin-role-badge">👑 Admin Panel</div>
          </div>
        </div>

        <!-- Admin Control Card with Supabase Online Status Toggle -->
        <div class="glass-card control-card">
          <div class="control-header">
            <span class="shield-icon">🛡️</span>
            <h3>অ্যাডমিন কন্ট্রোল প্যানেল</h3>
          </div>
          <div class="toggle-control">
            <span>অনলাইন উপস্থিতি স্ট্যাটাস:</span>
            <label class="switch">
              <input type="checkbox" id="admin-online-toggle" onchange="toggleAdminOnlineStatus(this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Graphic Illustration Center -->
        <div class="admin-graphic-center">
           <div class="graphic-divider-line"></div>
           <div class="graphic-icon-cluster">👥</div>
           <div class="chat-bubble-illustration">
             <div class="dots-row"><span></span><span></span><span></span></div>
           </div>
           <div class="user-purple-node">👤</div>
        </div>

      </section>
    </main>

    <!-- Bottom Navigation Bar with File Routing -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="location.href='admin-home.html'">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="location.href='chat.html'">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span>Chat</span>
      </div>
      <div class="nav-item" onclick="location.href='profile.html'">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </div>
      <div class="nav-item" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        <span>Settings</span>
      </div>
    </nav>

  </div>

  <!-- Supabase Integration Script -->
  <script>
    const SUPABASE_URL = "https://bagscbfokioflnuyxcuz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZ3NjYmZva2lvZmxudXl4Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjAxOTEsImV4cCI6MjEwODk5NjE5MX0.9iU1vhruNSO54Van2GIBM1OrofuUfplWtPC7O7cV60s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function checkAdminSession() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return;
      currentUser = session.user;
      loadAdminProfile();
    }

    async function loadAdminProfile() {
      const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      if (data) {
        if (data.avatar_url) document.getElementById('admin-avatar').src = data.avatar_url;
        if (data.full_name) document.getElementById('admin-name').innerText = data.full_name;
        document.getElementById('admin-online-toggle').checked = data.is_online || false;
      }
    }

    async function toggleAdminOnlineStatus(isOnline) {
      if (!currentUser) return;
      await db.from('profiles').update({ is_online: isOnline }).eq('id', currentUser.id);
    }

    window.onload = checkAdminSession;
  </script>
</body>
                                           </html>
