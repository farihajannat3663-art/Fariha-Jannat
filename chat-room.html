<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat Room - Fariha Jannat</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Popup Menu Style */
    .popup-menu {
      position: absolute;
      top: 55px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(120,86,232,0.2);
      border: 1px solid rgba(255,255,255,0.9);
      width: 200px;
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }
    .popup-item {
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-main);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }
    .popup-item:hover {
      background: rgba(120,86,232,0.1);
    }
    .popup-item.danger {
      color: #ef4444;
    }
    .delete-msg-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      margin-left: 4px;
      opacity: 0.7;
    }
    .delete-msg-btn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Background Glow & Bokeh -->
  <div class="glow-effect"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>

  <div class="bg-container">
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#B87DFF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
    </svg>
    <svg class="svg-element right-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,50 Q130,40 90,100 Q140,90 180,50 Z" fill="#B87DFF"/>
    </svg>
  </div>

  <div class="app-viewport">
    
    <!-- Chat Room Header -->
    <header class="chat-room-header" style="position: relative;">
      <div class="header-left">
        <button class="back-btn" onclick="location.href='chat.html'">←</button>
        <div class="header-avatar">
          <img id="receiver-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User">
          <span class="status-dot" id="receiver-status"></span>
        </div>
        <div class="header-info">
          <h3 id="receiver-name">Loading...</h3>
          <p id="receiver-status-text">Offline</p>
        </div>
      </div>
      <div class="header-icons">
        <button class="icon-btn" onclick="togglePopupMenu()">⋮</button>
      </div>

      <!-- Popup Menu for Admin Controls -->
      <div class="popup-menu" id="admin-popup-menu">
        <div class="popup-item" onclick="togglePermission('can_send_voice')">
          <span>Voice Permission</span>
          <input type="checkbox" id="perm-voice" checked onclick="event.stopPropagation(); togglePermission('can_send_voice')">
        </div>
        <div class="popup-item" onclick="togglePermission('can_send_photo')">
          <span>Photo Permission</span>
          <input type="checkbox" id="perm-photo" checked onclick="event.stopPropagation(); togglePermission('can_send_photo')">
        </div>
        <div class="popup-item danger" onclick="toggleBlockUser()">
          <span id="block-menu-text">Block User</span>
        </div>
        <div class="popup-item danger" onclick="deleteUserAccount()">
          <span>Delete Account</span>
        </div>
      </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main class="chat-messages-area" id="messages-container">
      <!-- Dynamic Messages -->
    </main>

    <!-- Bottom Input Area -->
    <footer class="chat-bottom-input-area">
      <div class="input-row-main">
        <button class="input-action-icon" id="photo-btn" onclick="triggerPhotoUpload()" title="Send Photo">🖼️</button>
        <input type="file" id="image-file-input" style="display: none;" accept="image/*" onchange="sendImageMessage(event)">
        
        <button class="input-action-icon" id="voice-btn" title="Send Voice">
          <svg viewBox="0 0 24 24" fill="#7856E8" width="20" height="20"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        
        <input type="text" id="message-input" placeholder="Type a message..." oninput="handleInputChange()">
        
        <button class="input-action-icon">😊</button>
        <button class="send-btn" id="main-action-btn" onclick="sendTextMessage()">➤</button>
      </div>
    </footer>

  </div>

  <!-- Script Area -->
  <script>
    const SUPABASE_URL = "https://bagscbfokioflnuyxcuz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZ3NjYmZva2lvZmxudXl4Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjAxOTEsImV4cCI6MjEwODk5NjE5MX0.9iU1vhruNSO54Van2GIBM1OrofuUfplWtPC7O7cV60s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const receiverId = urlParams.get('user_id');

    let currentUser = null;
    let receiverProfile = null;

    async function initChatRoom() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return;
      }
      currentUser = session.user;

      if (!receiverId) {
        alert("No user specified!");
        window.location.href = 'chat.html';
        return;
      }

      loadReceiverProfile();
      loadMessages();
      markMessagesAsSeen();
      subscribeToMessages();
    }

    async function loadReceiverProfile() {
      const { data } = await db.from('profiles').select('*').eq('id', receiverId).maybeSingle();
      if (data) {
        receiverProfile = data;
        if (data.avatar_url) document.getElementById('receiver-avatar').src = data.avatar_url;
        if (data.full_name) document.getElementById('receiver-name').innerText = data.full_name;
        document.getElementById('receiver-status-text').innerText = data.is_online ? "● Online" : "Offline";
        if (!data.is_online) document.getElementById('receiver-status').style.display = 'none';

        document.getElementById('perm-voice').checked = data.can_send_voice !== false;
        document.getElementById('perm-photo').checked = data.can_send_photo !== false;
        document.getElementById('block-menu-text').innerText = data.is_blocked ? "Unblock User" : "Block User";

        checkPermissions();
      }
    }

    function checkPermissions() {
      if (receiverProfile && receiverProfile.is_blocked) {
        const input = document.getElementById('message-input');
        if (input) {
          input.placeholder = "User is blocked!";
          input.disabled = true;
        }
      }
      const photoBtn = document.getElementById('photo-btn');
      if (photoBtn) {
        photoBtn.style.opacity = (receiverProfile && receiverProfile.can_send_photo === false) ? '0.3' : '1';
      }
      const voiceBtn = document.getElementById('voice-btn');
      if (voiceBtn) {
        voiceBtn.style.opacity = (receiverProfile && receiverProfile.can_send_voice === false) ? '0.3' : '1';
      }
    }

    function togglePopupMenu() {
      const menu = document.getElementById('admin-popup-menu');
      if (menu) menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    async function togglePermission(field) {
      const currentVal = receiverProfile[field] !== false;
      const newVal = !currentVal;
      
      receiverProfile[field] = newVal;
      const chk = document.getElementById(field === 'can_send_voice' ? 'perm-voice' : 'perm-photo');
      if (chk) chk.checked = newVal;
      checkPermissions();

      if (receiverId) {
        await db.from('profiles').update({ [field]: newVal }).eq('id', receiverId);
      }
    }

    async function toggleBlockUser() {
      const newBlockState = !receiverProfile.is_blocked;
      receiverProfile.is_blocked = newBlockState;
      alert(newBlockState ? "User blocked successfully." : "User unblocked.");
      
      if (receiverId) {
        await db.from('profiles').update({ is_blocked: newBlockState }).eq('id', receiverId);
      }
      checkPermissions();
    }

    async function deleteUserAccount() {
      if (confirm("Are you sure you want to delete this user account?")) {
        if (receiverId) {
          await db.from('profiles').delete().eq('id', receiverId);
        }
        alert("Account deleted.");
        window.location.href = 'chat.html';
      }
    }

    function handleInputChange() {
      const input = document.getElementById('message-input');
      const actionBtn = document.getElementById('main-action-btn');
      if (!input || !actionBtn) return;
      
      if (input.value.trim().length > 0) {
        actionBtn.style.transform = "scale(1.1)";
      } else {
        actionBtn.style.transform = "scale(1)";
      }
    }

    async function loadMessages() {
      const { data: messages } = await db
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      renderMessages(messages || []);
    }

    async function markMessagesAsSeen() {
      await db.from('messages')
        .update({ is_seen: true })
        .eq('sender_id', receiverId)
        .eq('receiver_id', currentUser.id)
        .eq('is_seen', false);
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      container.innerHTML = `<div class="date-badge-container"><div class="date-badge">Conversation Started</div></div>`;

      messages.forEach(msg => {
        const isOutgoing = msg.sender_id === currentUser.id;
        const row = document.createElement('div');
        row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;

        const timeStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        let seenStatusHtml = isOutgoing ? `<span class="seen-tick ${msg.is_seen ? 'read' : ''}">✓✓</span>` : '';
        let deleteBtnHtml = `<button class="delete-msg-btn" onclick="deleteMessage('${msg.id}')">🗑️</button>`;

        let contentHtml = msg.image_url ? 
          `<div class="msg-image-card"><img src="${msg.image_url}"><div class="msg-footer">${timeStr} ${seenStatusHtml} ${deleteBtnHtml}</div></div>` :
          `<div class="msg-bubble">${msg.content}<div class="msg-footer">${timeStr} ${seenStatusHtml} ${deleteBtnHtml}</div></div>`;

        if (!isOutgoing) {
          const avatar = document.createElement('img');
          avatar.className = 'msg-avatar';
          avatar.src = document.getElementById('receiver-avatar').src;
          row.appendChild(avatar);
        }

        const div = document.createElement('div');
        div.innerHTML = contentHtml;
        row.appendChild(div.firstElementChild);
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function deleteMessage(msgId) {
      await db.from('messages').delete().eq('id', msgId);
      loadMessages();
    }

    async function sendTextMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      if (receiverProfile && receiverProfile.is_blocked) {
        alert("You have blocked this user.");
        return;
      }

      const { error } = await db.from('messages').insert({
        sender_id: currentUser.id,
        receiver_id: receiverId,
        content: text,
        is_seen: false
      });

      if (error) {
        alert(error.message);
      } else {
        input.value = '';
        loadMessages();
      }
    }

    async function triggerPhotoUpload() {
      if (receiverProfile && receiverProfile.can_send_photo === false) {
        alert("Photo sharing is disabled for this user.");
        return;
      }
      document.getElementById('image-file-input').click();
    }

    async function sendImageMessage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const filePath = `chat_images/${currentUser.id}_${Date.now()}`;
      const { data, error } = await db.storage.from('chat_media').upload(filePath, file);

      if (error) {
        alert("Image upload failed: " + error.message);
        return;
      }

      const { data: { publicUrl } } = db.storage.from('chat_media').getPublicUrl(filePath);

      await db.from('messages').insert({
        sender_id: currentUser.id,
        receiver_id: receiverId,
        image_url: publicUrl,
        content: "[Photo]",
        is_seen: false
      });

      loadMessages();
    }

    function subscribeToMessages() {
      db.channel('public:messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
          loadMessages();
          if (payload.eventType === 'INSERT' && payload.new.sender_id === receiverId) {
            markMessagesAsSeen();
          }
        })
        .subscribe();
    }

    window.onload = initChatRoom;
  </script>
</body>
</html>
