<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Profile - Fariha Jannat</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Profile Specific Layout Adjustments */
    .profile-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-header-title {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .admin-header-title h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 15px;
    }

    .profile-avatar-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--primary);
      padding: 3px;
      background: white;
      box-shadow: 0 8px 25px rgba(120, 86, 232, 0.2);
    }

    .profile-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .crown-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: var(--primary);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(120, 86, 232, 0.3);
    }

    .profile-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-align: center;
    }

    .admin-panel-tag {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(120, 86, 232, 0.25);
    }

    .profile-tagline {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 25px;
      font-weight: 500;
      text-align: center;
    }

    .about-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 8px 25px rgba(120, 86, 232, 0.08);
      margin-bottom: 20px;
    }

    .about-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .about-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--primary);
    }

    .about-text {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .edit-profile-btn {
      width: 100%;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(120, 86, 232, 0.12);
      transition: 0.3s;
      margin-top: 10px;
    }

    .edit-profile-btn:hover {
      background: white;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Background Glow & Bokeh -->
  <div class="glow-effect"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>

  <div class="bg-container">
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#B87DFF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
    </svg>

    <svg class="svg-element right-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,50 Q130,40 90,100 Q140,90 180,50 Z" fill="#B87DFF"/>
    </svg>
  </div>

  <div class="app-viewport">
    
    <!-- Main Profile Content -->
    <main class="profile-content">
      
      <!-- Header Title -->
      <div class="admin-header-title">
        <button class="back-btn" onclick="history.back()">←</button>
        <h3>Admin Profile</h3>
      </div>

      <!-- Avatar & Crown -->
      <div class="profile-avatar-container">
        <div class="profile-avatar-ring">
          <img id="admin-avatar" src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=female_avatar_1" alt="Fariha Jannat">
        </div>
        <div class="crown-badge">👑</div>
      </div>

      <!-- Name & Badge -->
      <h2 class="profile-name" id="admin-name">Fariha Jannat</h2>
      <div>
        <span class="admin-panel-tag">👑 Admin Panel</span>
      </div>
      <p class="profile-tagline" id="admin-tagline">Dream Big • Stay Positive 💜</p>

      <!-- About Me Card -->
      <div class="about-card">
        <div class="about-header">
          <div class="about-title">
            <span>👤</span> About Me
          </div>
          <button class="edit-icon-btn" onclick="editBio()">✏️</button>
        </div>
        <p class="about-text" id="admin-bio">Hello! I'm Fariha Jannat. Always here to help you. 💜</p>
      </div>

      <!-- Edit Profile Button -->
      <button class="edit-profile-btn" onclick="editProfile()">
        ✏️ Edit Profile
      </button>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <div class="nav-item" onclick="location.href='admin-home.html'">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="location.href='chat.html'">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span>Chat</span>
      </div>
      <div class="nav-item active" onclick="location.href='profile.html'">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </div>
      <div class="nav-item" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        <span>Settings</span>
      </div>
    </nav>

  </div>

  <!-- Supabase Admin Profile Logic -->
  <script>
    const SUPABASE_URL = "https://bagscbfokioflnuyxcuz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZ3NjYmZva2lvZmxudXl4Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjAxOTEsImV4cCI6MjEwODk5NjE5MX0.9iU1vhruNSO54Van2GIBM1OrofuUfplWtPC7O7cV60s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAdminProfile() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return;

      const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      if (profile) {
        if (profile.full_name) document.getElementById('admin-name').innerText = profile.full_name;
        if (profile.avatar_url) document.getElementById('admin-avatar').src = profile.avatar_url;
        if (profile.bio) document.getElementById('admin-bio').innerText = profile.bio;
      }
    }

    async function editBio() {
      const newBio = prompt("Enter your new bio:");
      if (!newBio) return;

      const { data: { session } } = await db.auth.getSession();
      if (!session) return;

      const { error } = await db.from('profiles').update({ bio: newBio }).eq('id', session.user.id);
      if (error) {
        alert(error.message);
      } else {
        document.getElementById('admin-bio').innerText = newBio;
        alert("Bio updated successfully!");
      }
    }

    function editProfile() {
      alert("Profile edit mode active!");
    }

    window.onload = loadAdminProfile;
  </script>
</body>
</html>
