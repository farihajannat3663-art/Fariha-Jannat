<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Profile - Fariha Jannat App</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Profile Specific Layout Adjustments */
    .profile-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-header-title {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .admin-header-title h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 15px;
    }

    .profile-avatar-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--primary);
      padding: 3px;
      background: white;
      box-shadow: 0 8px 25px rgba(120, 86, 232, 0.2);
    }

    .profile-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-align: center;
    }

    .user-panel-tag {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(120, 86, 232, 0.25);
    }

    .profile-tagline {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 25px;
      font-weight: 500;
      text-align: center;
    }

    .about-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 8px 25px rgba(120, 86, 232, 0.08);
      margin-bottom: 20px;
    }

    .about-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .about-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--primary);
    }

    .about-text {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .edit-profile-btn {
      width: 100%;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(120, 86, 232, 0.12);
      transition: 0.3s;
      margin-top: 10px;
    }

    .edit-profile-btn:hover {
      background: white;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Background Glow & Bokeh -->
  <div class="glow-effect"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>

  <div class="bg-container">
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#B87DFF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
    </svg>
    <svg class="svg-element right-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,50 Q130,40 90,100 Q140,90 180,50 Z" fill="#B87DFF"/>
    </svg>
  </div>

  <div class="app-viewport">
    
    <!-- Main Profile Content -->
    <main class="profile-content">
      
      <!-- Header Title -->
      <div class="admin-header-title">
        <button class="back-btn" onclick="location.href='home.html'">←</button>
        <h3>My Profile</h3>
      </div>

      <!-- Avatar Container -->
      <div class="profile-avatar-container">
        <div class="profile-avatar-ring">
          <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sadya" alt="User Profile">
        </div>
      </div>

      <!-- Name & Badge -->
      <h2 class="profile-name" id="user-name">Sadya</h2>
      <div>
        <span class="user-panel-tag">💜 App Member</span>
      </div>
      <p class="profile-tagline" id="user-tagline">Exploring Fariha Jannat App</p>

      <!-- About Me Card -->
      <div class="about-card">
        <div class="about-header">
          <div class="about-title">
            <span>👤</span> About Me
          </div>
          <button class="edit-icon-btn" onclick="editBio()">✏️</button>
        </div>
        <p class="about-text" id="user-bio">Hello! I'm using this wonderful app to connect and chat. ✨</p>
      </div>

      <!-- Edit Profile Button -->
      <button class="edit-profile-btn" onclick="editProfile()">
        ✏️ Edit Profile
      </button>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <div class="nav-item" onclick="location.href='home.html'">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="location.href='user-chat.html'">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span>Chat</span>
      </div>
      <div class="nav-item active" onclick="location.href='user-profile.html'">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </div>
    </nav>

  </div>

  <!-- Supabase User Profile Logic -->
  <script>
    const SUPABASE_URL = "https://bagscbfokioflnuyxcuz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZ3NjYmZva2lvZmxudXl4Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjAxOTEsImV4cCI6MjEwODk5NjE5MX0.9iU1vhruNSO54Van2GIBM1OrofuUfplWtPC7O7cV60s";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadUserProfile() {
      try {
        const { data: { session } } = await db.auth.getSession();
        if (!session) return;

        const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
        if (profile) {
          if (profile.full_name) document.getElementById('user-name').innerText = profile.full_name;
          if (profile.avatar_url) document.getElementById('user-avatar').src = profile.avatar_url;
          if (profile.bio) document.getElementById('user-bio').innerText = profile.bio;
        }
      } catch (err) {
        console.log("Running in preview mode");
      }
    }

    async function editBio() {
      const newBio = prompt("Enter your new bio:");
      if (!newBio) return;

      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        document.getElementById('user-bio').innerText = newBio;
        alert("Bio updated successfully!");
        return;
      }

      const { error } = await db.from('profiles').update({ bio: newBio }).eq('id', session.user.id);
      if (error) {
        alert(error.message);
      } else {
        document.getElementById('user-bio').innerText = newBio;
        alert("Bio updated successfully!");
      }
    }

    function editProfile() {
      alert("Profile edit mode active!");
    }

    window.onload = loadUserProfile;
  </script>
</body>
        </html>
