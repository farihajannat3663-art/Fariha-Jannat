<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Floral Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #E8D8FF 0%, #F4E8FF 50%, #E0CCFF 100%);
      font-family: sans-serif;
    }

    /* পেছনের গ্লো ইফেক্ট */
    .glow-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* বাতাসে ভাসমান সাদা কণা (Bokeh Effect) */
    .bokeh {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      animation: float 8s infinite ease-in-out alternate;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.4; }
      100% { transform: translateY(-20px) scale(1.2); opacity: 0.9; }
    }

    /* ডিজাইনের মূল কন্টেইনার */
    .bg-container {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* --- উপরের এবং নিচের কার্ভ (Waves) --- */
    .top-wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 300px;
      background: linear-gradient(180deg, #A266FF 0%, transparent 100%);
      clip-path: ellipse(80% 60% at 50% 0%);
      opacity: 0.6;
    }

    .bottom-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 350px;
      background: linear-gradient(0deg, #9B51E0 0%, #D6A4FF 40%, transparent 100%);
      clip-path: ellipse(120% 60% at 50% 100%);
      opacity: 0.5;
    }

    .bottom-wave-2 {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(0deg, #C084FC 0%, transparent 100%);
      clip-path: polygon(0 100%, 100% 100%, 100% 20%, 0 70%);
      opacity: 0.4;
    }

    /* --- ফুল ও পাতার SVG স্টাইল --- */
    .svg-element {
      position: absolute;
      filter: drop-shadow(0px 10px 15px rgba(120, 86, 232, 0.2));
    }

    /* বাম দিকের ফুল */
    .bottom-left-flower {
      bottom: -20px;
      left: -40px;
      width: 320px;
      transform-origin: bottom left;
      animation: swayLeft 6s infinite alternate ease-in-out;
    }

    /* ডান দিকের পাতা */
    .bottom-right-leaves {
      bottom: -10px;
      right: -20px;
      width: 250px;
      transform-origin: bottom right;
      animation: swayRight 7s infinite alternate ease-in-out;
    }

    /* উপরের ডান দিকের পাতা */
    .top-right-leaves {
      top: -20px;
      right: -30px;
      width: 280px;
      transform-origin: top right;
      animation: swayRight 5s infinite alternate ease-in-out;
    }

    /* বাম দিকের হালকা পাতা */
    .left-mid-leaves {
      top: 25%;
      left: -60px;
      width: 200px;
      opacity: 0.7;
    }

    /* অ্যানিমেশন (মৃদু দোলা) */
    @keyframes swayLeft {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(5deg); }
    }

    @keyframes swayRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-5deg); }
    }

    /* ডেমো কন্টেন্ট (টেস্ট করার জন্য) */
    .content-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 40px rgba(120, 86, 232, 0.15);
      text-align: center;
      color: #7856E8;
    }
  </style>
</head>
<body>

  <!-- গ্লো ইফেক্ট -->
  <div class="glow-effect"></div>

  <!-- ভাসমান বোকেহ (কণা) -->
  <div class="bokeh" style="width: 10px; height: 10px; top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="bokeh" style="width: 15px; height: 15px; top: 30%; left: 80%; animation-delay: 1.5s;"></div>
  <div class="bokeh" style="width: 8px; height: 8px; top: 70%; left: 10%; animation-delay: 3s;"></div>
  <div class="bokeh" style="width: 12px; height: 12px; top: 80%; left: 85%; animation-delay: 2s;"></div>
  <div class="bokeh" style="width: 6px; height: 6px; top: 50%; left: 50%; animation-delay: 4s;"></div>
  <div class="bokeh" style="width: 18px; height: 18px; top: 10%; left: 60%; animation-delay: 5s;"></div>

  <!-- ব্যাকগ্রাউন্ড ডিজাইন কন্টেইনার -->
  <div class="bg-container">
    
    <!-- কার্ভ ওয়েভ -->
    <div class="top-wave"></div>
    <div class="bottom-wave"></div>
    <div class="bottom-wave-2"></div>

    <!-- বাম দিকের বড় ফুল (SVG) -->
    <svg class="svg-element bottom-left-flower" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#D18AFF" />
          <stop offset="100%" stop-color="#7856E8" />
        </linearGradient>
        <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#9B51E0" />
          <stop offset="100%" stop-color="#D6A4FF" />
        </linearGradient>
      </defs>
      <!-- পাতা -->
      <path d="M40,170 Q10,120 60,90 Q80,140 40,170 Z" fill="url(#leafGrad)"/>
      <path d="M50,180 Q90,140 130,160 Q100,190 50,180 Z" fill="url(#leafGrad)"/>
      <path d="M30,150 Q0,140 10,100 Q40,120 30,150 Z" fill="url(#leafGrad)"/>
      <!-- ফুলের পাপড়ি -->
      <g transform="translate(70, 100) scale(0.8)">
        <path d="M0,0 C-30,-40 30,-40 0,0" fill="url(#flowerGrad)" transform="rotate(0)"/>
        <path d="M0,0 C-30,-40 30,-40 0,0" fill="url(#flowerGrad)" transform="rotate(72)"/>
        <path d="M0,0 C-30,-40 30,-40 0,0" fill="url(#flowerGrad)" transform="rotate(144)"/>
        <path d="M0,0 C-30,-40 30,-40 0,0" fill="url(#flowerGrad)" transform="rotate(216)"/>
        <path d="M0,0 C-30,-40 30,-40 0,0" fill="url(#flowerGrad)" transform="rotate(288)"/>
        <circle cx="0" cy="0" r="10" fill="#FCE1FF"/>
      </g>
      <!-- ছোট কুঁড়ি -->
      <circle cx="40" cy="50" r="10" fill="#A266FF"/>
      <circle cx="20" cy="70" r="8" fill="#A266FF"/>
    </svg>

    <!-- ডান দিকের নিচের পাতা (SVG) -->
    <svg class="svg-element bottom-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
       <defs>
        <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#B87DFF" />
          <stop offset="100%" stop-color="#E6CCFF" />
        </linearGradient>
      </defs>
      <path d="M180,180 Q140,100 160,40 Q190,120 180,180 Z" fill="url(#leafGrad2)"/>
      <path d="M160,170 Q100,120 100,60 Q140,120 160,170 Z" fill="url(#leafGrad2)"/>
      <path d="M190,150 Q160,90 190,30 Q210,100 190,150 Z" fill="url(#leafGrad2)"/>
    </svg>

    <!-- উপরের ডান দিকের পাতা (SVG) -->
    <svg class="svg-element top-right-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M180,20 Q120,40 80,100 Q130,80 180,20 Z" fill="url(#leafGrad2)"/>
      <path d="M190,50 Q140,70 100,130 Q150,110 190,50 Z" fill="url(#leafGrad2)"/>
      <path d="M170,10 Q110,20 70,70 Q120,50 170,10 Z" fill="url(#leafGrad2)"/>
    </svg>

    <!-- বাম দিকের মাঝখানের হালকা পাতা -->
    <svg class="svg-element left-mid-leaves" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q60,40 100,100 Q50,90 10,50 Z" fill="#D6A4FF"/>
      <path d="M0,80 Q40,70 80,130 Q30,120 0,80 Z" fill="#D6A4FF"/>
      <path d="M20,20 Q70,10 110,70 Q60,60 20,20 Z" fill="#D6A4FF"/>
    </svg>

  </div>

  <!-- টেস্ট করার জন্য গ্লাস কার্ড -->
  <div class="content-overlay">
    <div class="glass-card">
      <h1>Fariha Jannat</h1>
      <p>Premium Background Design Test</p>
    </div>
  </div>

</body>
</html>
