<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fariha Jannat — Personal Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Top Header Navigation -->
    <header class="top-header">
      <div class="brand-title">
        <span class="brand-name">Fariha Jannat</span>
      </div>
      <div class="header-actions">
        <!-- Language Switcher Dropdown -->
        <select id="lang-selector" onchange="changeLanguage(this.value)" class="lang-select">
          <option value="en">English 🇬🇧</option>
          <option value="bn">বাংলা 🇧🇩</option>
        </select>
        
        <!-- Dark/Light Theme Toggle -->
        <button class="btn-icon" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
        
        <!-- Settings (Only when logged in) -->
        <button id="btn-settings" class="btn-icon hidden" onclick="openProfileModal()">⚙️</button>
        <button id="btn-logout" class="btn-icon danger hidden" onclick="handleLogout()">🚪</button>
      </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="main-content">

      <!-- Auth Screen (Welcome / Login / Register) -->
      <section id="auth-screen" class="screen active">
        <div class="auth-card">
          <div class="welcome-header">
            <h2 data-i18n="welcomeTitle">Welcome to My Platform</h2>
            <p data-i18n="welcomeSub">Connect directly with Fariha Jannat</p>
          </div>

          <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')" data-i18n="loginTab">Login</button>
            <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')" data-i18n="signupTab">Register</button>
          </div>

          <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="input-group" id="name-group" style="display: none;">
              <label data-i18n="fullNameLabel">Full Name</label>
              <input type="text" id="auth-name" placeholder="John Doe">
            </div>
            
            <div class="input-group">
              <label data-i18n="emailLabel">Email Address</label>
              <input type="email" id="auth-email" placeholder="example@mail.com" required>
            </div>
            
            <div class="input-group">
              <label data-i18n="passwordLabel">Password</label>
              <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="auth-submit-btn" class="btn-gradient" data-i18n="loginBtn">Login</button>
          </form>
        </div>
      </section>

      <!-- User Home View -->
      <section id="user-view" class="screen">
        <div class="premium-card">
          <div class="profile-avatar-wrap">
            <img id="owner-photo" src="https://via.placeholder.com/150" alt="Fariha Jannat">
            <span id="owner-status-dot" class="status-badge offline"></span>
          </div>
          <h2 class="owner-name">Fariha Jannat</h2>
          <p id="owner-status-text" class="status-text" data-i18n="statusOffline">Currently Offline</p>

          <button class="btn-gradient chat-trigger-btn" onclick="openChatModal()">
            💬 <span data-i18n="btnStartChat">Message Fariha</span>
          </button>
        </div>
      </section>

      <!-- Admin Panel View -->
      <section id="admin-view" class="screen">
        <div class="admin-dashboard">
          <div class="admin-card">
            <h3 data-i18n="adminControlTitle">🛡️ Admin Command Center</h3>
            
            <div class="toggle-control">
              <span data-i18n="adminLiveStatus">Online Presence Status:</span>
              <input type="checkbox" id="admin-online-toggle" onchange="toggleAdminOnlineStatus(this.checked)">
            </div>

            <div class="admin-actions">
              <button class="btn-action warning" onclick="adminDelete20MinMedia()" data-i18n="btnDelete20Min">
                🗑️ Delete 20 Min Media
              </button>
              <button class="btn-action danger" onclick="adminDelete7DaysInactive()" data-i18n="btnDeleteInactive">
                🧹 Purge 7-Day Inactive Users
              </button>
            </div>
          </div>

          <div class="user-list-card">
            <h4 data-i18n="userListTitle">👥 Registered Users</h4>
            <div id="users-list-container" class="users-container"></div>
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- Private Chat Modal -->
  <div id="chat-modal" class="modal">
    <div class="modal-content chat-layout">
      <div class="chat-header">
        <button class="btn-back" onclick="closeChatModal()">←</button>
        <div class="chat-user-info">
          <h4>Fariha Jannat</h4>
          <span id="chat-status-sub" class="sub-text" data-i18n="statusOffline">Offline</span>
        </div>
      </div>

      <div id="chat-messages" class="chat-messages-area">
        <!-- Dynamic Chat Bubbles -->
      </div>

      <div class="chat-footer">
        <div class="media-actions">
          <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
          <button id="btn-attach-image" class="btn-media" onclick="document.getElementById('image-input').click()">📷</button>
          <button id="btn-record-voice" class="btn-media" onclick="toggleVoiceRecording()">🎙️</button>
        </div>

        <input type="text" id="message-input" data-i18n-placeholder="typeMessagePlaceholder" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()" data-i18n="btnSend">Send</button>
      </div>
    </div>
  </div>

  <!-- Profile & Settings Modal -->
  <div id="profile-modal" class="modal">
    <div class="modal-content profile-edit-layout">
      <div class="modal-header">
        <h3 data-i18n="profileModalTitle">Profile Settings</h3>
        <button class="btn-close" onclick="closeProfileModal()">✕</button>
      </div>

      <div class="profile-body">
        <div class="input-group">
          <label data-i18n="editNameLabel">Your Display Name</label>
          <input type="text" id="edit-name">
        </div>

        <!-- Avatar Selector (For Regular Users) -->
        <div id="avatar-section">
          <label data-i18n="selectAvatarLabel">Choose Coded Avatar:</label>
          <div class="avatar-gender-tabs">
            <button onclick="renderAvatarGrid('male')" data-i18n="tabMale">Male</button>
            <button onclick="renderAvatarGrid('female')" data-i18n="tabFemale">Female</button>
          </div>
          <div id="avatar-grid" class="avatar-grid"></div>
        </div>

        <!-- Photo Upload (For Admin Only) -->
        <div id="admin-photo-section" style="display: none;">
          <label data-i18n="adminPhotoLabel">Upload Official Profile Photo:</label>
          <input type="file" id="admin-photo-input" accept="image/*" onchange="uploadAdminPhoto(event)">
        </div>

        <button class="btn-gradient" onclick="saveProfileChanges()" data-i18n="btnSaveProfile">Save Changes</button>
        
        <hr class="divider">
        
        <!-- User Self Account Deletion -->
        <button id="btn-self-delete" class="btn-danger" onclick="deleteMyAccount()" data-i18n="btnDeleteAccount">
          Delete My Account Permanently
        </button>
      </div>
    </div>
  </div>

  <script src="avatars.js"></script>
  <script src="app.js"></script>
</body>
</html>
